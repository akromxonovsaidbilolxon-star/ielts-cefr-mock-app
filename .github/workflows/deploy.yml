name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - arena/964ca4d5-ielts-cefr-mock-app
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # Supabase credentials are injected from repository secrets. The URL and
      # anon key are public by design — Row Level Security in the database is
      # what protects the data, not the secrecy of these values.
      - name: Check Supabase configuration
        env:
          SB_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SB_ANON: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SB_URL" ] || [ -z "$SB_ANON" ]; then
            echo "::error title=Sign-in not configured::Set the VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY secrets. Without them nobody can sign in and the app is unusable."
            exit 1
          fi

          # Refuse to publish if the service role key was pasted by mistake.
          # It bypasses every RLS policy and would hand full database access to
          # anyone who opens the site.
          ROLE=$(printf '%s' "$SB_ANON" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).role||"")}catch{console.log("")}})' || true)
          if [ "$ROLE" = "service_role" ]; then
            echo "::error title=SECURITY: service role key exposed::VITE_SUPABASE_ANON_KEY contains the service_role key. It grants unrestricted database access to every visitor. Replace it with the anon/public key."
            exit 1
          fi
          if [ "$ROLE" != "anon" ]; then
            echo "::warning title=Unusual key role::Could not confirm the Supabase key is the anon/public key (role='$ROLE')."
          fi
          echo "::notice title=Sign-in configured::Supabase credentials look valid."

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # Fail loudly rather than silently publishing an app nobody can sign into.
      - name: Verify credentials are baked into the build
        env:
          SB_ANON: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          SLICE=$(printf '%s' "$SB_ANON" | cut -c1-40)
          if grep -qF "$SLICE" ./dist/assets/*.js 2>/dev/null; then
            echo "✔ Supabase credentials are baked into the bundle."
          else
            echo "::error title=Build cannot sign in::The Supabase anon key is absent from the built JavaScript, so sign-in would fail for every user."
            exit 1
          fi

          # Final guard: no service role key anywhere in the shipped files.
          if grep -qE 'service_role' ./dist/assets/*.js 2>/dev/null; then
            echo "::error title=SECURITY: service role referenced in bundle::Remove it before publishing."
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
